services:
  db:
    image: postgres:18
    container_name: arcadia-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: arcadia
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./src/Arcadia.Api/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d arcadia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: